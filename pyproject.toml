[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-extrapolation"
version = "0.1.0"
description = "Formula-free affine-tail neural regression for strict convex-hull extrapolation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "PP research project"}]
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "scipy>=1.9,<2",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
pp-run = "pp_extrapolation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

